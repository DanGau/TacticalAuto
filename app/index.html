<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10141c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>TacticalAuto</title>
    <style>
      body { margin: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overflow: hidden; height: 100vh; display: flex; align-items: center; background: #10141c; color: #dde; font: 14px sans-serif; }
      canvas { display: block; position: fixed; inset: 0; }
      /* The panels are laid out for a 1280 by 720 window and scale with it. */
      body > :not(canvas, script) { zoom: var(--ui, 1); }
      #hud { position: absolute; top: 12px; left: 12px; pointer-events: none; }
      /* The turn dial: a sphere, its allied half and its enemy half, that turns the side whose turn it is to the front. */
      #dial { position: absolute; top: 12px; right: 12px; width: 76px; height: 76px; perspective: 320px; pointer-events: none; }
      #dial[hidden] { display: none; }
      #dial .spin { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateY(var(--turn, 0deg)); transition: transform 0.9s cubic-bezier(0.65, 0, 0.35, 1); }
      #dial .half { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; border-radius: 50%; backface-visibility: hidden; color: #fff; font: bold 10px/1.2 sans-serif; letter-spacing: 1px; text-align: center; text-transform: uppercase; text-shadow: 0 1px 2px #0008; }
      #dial .ally { background: radial-gradient(circle at 50% 50%, #4f9be0, #1d4f86 70%, #0d2440); }
      #dial .enemy { transform: rotateY(180deg); background: radial-gradient(circle at 50% 50%, #e0574a, #8a2a22 70%, #3d0f0b); }
      #dial::after { content: ''; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 34% 28%, #ffffff59, transparent 42%), radial-gradient(circle at 50% 50%, transparent 58%, #0007 100%); box-shadow: 0 2px 10px #0009; }
      #panel { position: fixed; inset: 0; zoom: calc(var(--ui, 1) * var(--shrink, 1)); overflow-x: hidden; overflow-y: auto; box-sizing: border-box; padding: 14px max(24px, calc(50% - 600px)) 18px; background: #171d29; }
      #panel[hidden], #drop[hidden] { display: none; }
      /* The briefing as a film: bars across the top and bottom, a muted grade, and the edges sunk into dark. */
      body::before, body::after { content: ''; position: fixed; left: 0; right: 0; z-index: 4; height: 0; background: #000; transition: height 0.9s ease-in-out; pointer-events: none; }
      body::before { top: 0; }
      body::after { bottom: 0; }
      body.cinema::before, body.cinema::after { height: 11vh; }
      canvas { transition: filter 1.2s ease-in-out; }
      body.cinema canvas:first-of-type { filter: saturate(0.8) contrast(1.12) brightness(0.95); }
      body.cinema .brief { bottom: 1.5vh; background: none; }
      .vignette { position: fixed; inset: 0; z-index: 3; pointer-events: none; background: radial-gradient(ellipse at 58% 42%, transparent 45%, rgba(0, 0, 0, 0.55) 100%); opacity: 0; transition: opacity 1.2s ease-in-out; }
      body.cinema .vignette { opacity: 1; }
      #hud { transition: opacity 0.6s; }
      body.cinema #hud { opacity: 0; }
      .brief { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 5; width: min(560px, calc(100vw - 32px)); box-sizing: border-box; padding: 10px 16px; border-radius: 8px; background: rgba(10, 13, 19, 0.85); color: #e8e2c8; font-size: 16px; line-height: 1.5; pointer-events: none; animation: fade 0.4s; }
      .brief p { margin: 0; animation: fade 0.6s; }
      .brief p:not(:last-child) { color: #9aa6bd; font-size: 14px; }
      #drop.briefing { visibility: hidden; }
      .intro { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 16px; background: radial-gradient(#232c3d, #0a0d13 70%); text-align: center; animation: fade 0.6s; }
      .intro svg { width: min(52vh, 80vw); height: auto; }
      .intro h1 { font-size: 32px; letter-spacing: 2px; text-transform: uppercase; }
      .intro p { max-width: 520px; color: #9aa6bd; font-style: italic; }
      .intro button { margin-top: 12px; }
      @keyframes fade { from { opacity: 0; } }
      #kit { position: absolute; top: 100px; right: 12px; display: flex; flex-direction: column; gap: 6px; width: 180px; }
      #kit[hidden] { display: none; }
      #kit button { text-align: left; padding: 6px 8px; font-size: 14px; line-height: 1.3; }
      #kit button small { display: block; color: #9aa6bd; }
      #kit button.primed { outline: 2px solid #ffd166; }
      #kit .empty { opacity: 0.35; border-style: dashed; }
      .bought, button.bought:disabled { opacity: 0.3; filter: grayscale(1); }
      .purchased { color: #ffd166; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
      .choices .kit { flex: 1; margin: 0; align-self: center; color: #9aa6bd; }
      #drop { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); width: min(560px, calc(100vw - 32px)); box-sizing: border-box; padding: 10px 14px; background: #171d29ee; border: 1px solid #3a465c; border-radius: 8px; line-height: 1.5; }
      #drop .entrances { display: flex; gap: 8px; align-items: center; }
      #drop .entrances button { flex: 1; white-space: nowrap; padding: 6px 8px; }
      #drop .entrances button.on { outline: 2px solid #ffd166; }
      #drop .entrances .overview { flex: 0 0 auto; }
      #drop > button { margin-top: 6px; width: 100%; }
      h1 { margin: 0 0 4px; font-size: 22px; }
      h2 { margin: 16px 0 8px; font-size: 14px; font-weight: normal; color: #9aa6bd; }
      p { margin: 6px 0; }
      ul { margin: 0; padding: 0; list-style: none; line-height: 1.6; }
      table { border-spacing: 0; }
      small { color: #9aa6bd; }
      .up { color: #ff6b5e; }
      .down { color: #7ddc5a; }
      .supplies { color: #ffd84d; }

      button { font: inherit; color: #dde; background: #263042; border: 1px solid #4a5a78; border-radius: 6px; padding: 10px 16px; cursor: pointer; }
      button:hover { background: #32405a; }
      button:disabled { opacity: 0.45; cursor: default; }
      button:disabled:hover { background: #263042; }

      .header { display: flex; align-items: center; gap: 24px; position: relative; z-index: 2; }
      /* Flight: the map fills the screen under the header and what floats over it. */
      .map.flight { position: fixed; inset: 0; z-index: 0; padding: 0; }
      .map.flight .globe { position: absolute; inset: 0; }
      .strip { position: fixed; left: 16px; top: 70px; z-index: 2; display: flex; gap: 8px; }
      .strip .mate { width: 40px; }
      .strip .portrait { width: 34px; height: 34px; font-size: 18px; margin: 0 auto; }
      .strip .bar { height: 5px; margin: 4px 0 0; }
      .strip .bar div { background: #4fe08a; }
      .strip .low .portrait { border-color: #e04848; background: #3a1414; }
      .strip .low .bar div { background: #e04848; }
      .stopcard { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 2; max-width: 640px; padding: 8px 16px; border-radius: 10px; background: #171d29dd; border: 1px solid #3a465c; white-space: nowrap; pointer-events: none; }
      .tabs { display: flex; gap: 4px; flex: 1; }
      .tab { padding: 6px 18px; background: none; border-color: transparent; color: #9aa6bd; }
      .tab.active { background: #263042; border-color: #4a5a78; color: #dde; }

      .threat { display: inline-flex; width: 120px; height: 8px; margin: 0 8px; vertical-align: middle; background: #10141c; border: 1px solid #ff6b5e; border-radius: 4px; overflow: hidden; }
      .threat i { background: #ff6b5e; }
      .threat i.landed { background: #ffd84d; transition: width 0.6s 0.6s; }
      .skip { position: absolute; right: 24px; bottom: 24px; z-index: 6; }
      #fullscreen { position: absolute; bottom: 12px; left: 12px; z-index: 10; padding: 6px 10px; font-size: 18px; }
      :fullscreen #fullscreen { display: none; }
      /* Installed, the game opens full screen already. */
      @media (display-mode: fullscreen), (display-mode: standalone) { #fullscreen { display: none; } }
      .menu { text-align: center; padding: 24px 0 8px; }
      .menu:not(.picking) { animation: rise 0.6s both; }
      .menu h1 { font-size: 44px; letter-spacing: 6px; margin: 24px 0 8px; }
      .menu > p { color: #9aa6bd; margin-bottom: 28px; }
      .menu .choices { text-align: left; margin: 16px 0 20px; }
      .story { max-width: 640px; margin: 8vh auto 0; animation: none; }
      .story p, .story button { font-size: 19px; line-height: 1.6; color: #e8e2c8; animation: rise 1.1s backwards; }
      .story p { margin: 0 0 18px; }
      .recruit .home { color: #9ad7ff; }
      .recruit { position: relative; display: flex; flex-direction: column; gap: 10px; width: 240px; padding: 14px; border-radius: 10px; background: #35496b; text-align: left; }
      .recruit .feats { display: flex; flex-wrap: wrap; gap: 4px; }
      .recruit .more { color: #9aa6bd; }
      .recruit.chosen .defs { display: flex; position: static; width: auto; padding: 0; }
      .recruit .name { font-size: 20px; }
      .recruit .trait { display: flex; flex-direction: column; gap: 2px; margin-top: auto; padding-top: 8px; border-top: 1px solid #3a465c; }
      .recruit.chosen { outline: 2px solid #ffd84d; background: #35496b; }
      .note { font-size: 12px; color: #9aa6bd; white-space: nowrap; }
      .chip { padding: 4px 10px; border: 1px solid #4a5a78; border-radius: 12px; white-space: nowrap; }
      .chip.feat { border-color: #ffd84d; color: #ffd84d; cursor: help; }
      /* The run map: a globe, the stops pinned over it. */
      .map { display: flex; justify-content: center; padding: 4px 0 8px; }
      .globe { position: relative; flex: none; overflow: hidden; }
      .globe .sea { position: absolute; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #1d3a5e, #0a1626 75%); box-shadow: 0 0 40px 8px #4da3ff40; }
      .homes { display: flex; justify-content: center; opacity: 0.85; }
      .homes .home { display: block; transform: translate(-50%, -50%); width: 10px; height: 10px; border-radius: 50%; background: #c77dff; text-indent: 16px; line-height: 10px; white-space: nowrap; font-size: 12px; color: #e8e2c8; text-shadow: 0 0 4px #0a1626; }
      .homes .home.chosen { background: #ffd166; box-shadow: 0 0 10px #ffd166; color: #ffd166; font-weight: bold; }
      .homes .cell { transform: none; }
      .globe svg { position: absolute; inset: 0; }
      .globe .land { fill: #23402f; stroke: #7fe7c4; stroke-width: 1.2; stroke-opacity: 0.55; filter: drop-shadow(0 0 4px #4fe0a088); }
      .globe .graticule { fill: none; stroke: #4da3ff; stroke-opacity: 0.12; stroke-width: 0.8; }
      .globe .walked { fill: none; stroke: #ffd166; stroke-width: 3; stroke-linecap: round; filter: drop-shadow(0 0 4px #ffd166); }
      .globe .trail { stroke: #dde; stroke-opacity: 0.6; stroke-width: 2; stroke-dasharray: 3 5; }
      .globe .trail.lit { stroke: #ffd166; stroke-opacity: 1; stroke-width: 3; filter: drop-shadow(0 0 3px #ffd166); }
      .globe .trail.dim { stroke-opacity: 0.2; }
      .globe .cell.dim { opacity: 0.4; }
      .globe .city circle { fill: #c77dff; stroke: #fff; stroke-width: 1.5; }
      .globe .city.reached circle { fill: #ffd166; }
      .globe .city text { fill: #e8e2c8; font-size: 13px; font-weight: bold; paint-order: stroke; stroke: #0a1626; stroke-width: 4px; }
      .globe .cell { position: absolute; transform: translate(-50%, -50%); z-index: 1; }
      .map .node { display: inline-block; font-size: 16px; width: 30px; height: 30px; line-height: 30px; border-width: 2px; flex: none; }
      .map .node sup { font-size: 9px; }
      .node.done { opacity: 0.55; }
      .node.here { box-shadow: 0 0 0 3px #ffd166, 0 0 14px #ffd166; }
      .globe .cell.choice { z-index: 2; }
      .globe .cell:not(.choice):not(.squad) .node { transform: scale(0.75); opacity: 0.75; }
      button.option { position: relative; padding: 0; border: none; background: none; border-radius: 50%; }
      button.option .node { width: 40px; height: 40px; line-height: 40px; font-size: 22px; border-color: #ffd166; box-shadow: 0 0 0 3px #ffd166, 0 0 16px #ffd166; animation: pulse 1.6s ease-in-out infinite; }
      button.option::before { content: ''; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid #ffd166; animation: ripple 1.6s ease-out infinite; pointer-events: none; }
      button.option.picked .node { box-shadow: 0 0 0 5px #fff, 0 0 26px #ffd166; animation: none; }
      button.option:hover .node { box-shadow: 0 0 0 4px #ffd166, 0 0 22px #ffd166; }
      button.option .label { position: absolute; left: 50%; top: 100%; transform: translate(-50%, 4px); white-space: nowrap; color: #e8e2c8; font-size: 13px; text-shadow: 0 0 4px #0a1626, 0 0 4px #0a1626; }
      @keyframes ripple { from { transform: scale(0.9); opacity: 0.9; } to { transform: scale(1.8); opacity: 0; } }
      .chopper { position: absolute; z-index: 3; transform: translate(-50%, -110%); font-size: 28px; pointer-events: none; filter: drop-shadow(0 6px 3px #0008); transition: left 1.1s ease-in-out, top 1.1s ease-in-out; }
      .chopper span { display: inline-block; animation: hover 1.2s ease-in-out infinite; }
      .chopper.east span { transform: scaleX(-1); }
      .chopper.flying span { animation: none; }
      .chopper.flying.east span { transform: scaleX(-1) rotate(-12deg); }
      .chopper.flying:not(.east) span { transform: rotate(12deg); }
      @keyframes hover { 50% { translate: 0 -4px; } }
      .globe.gliding .isle,
      .globe.gliding .city:not(.reached), .globe.gliding .cell.choice, .globe.gliding .trail { opacity: 0; }
      .globe.arrived .trail { animation: fade 0.5s 0.15s both; }
      .globe.arrived .isle { animation: fade 0.4s both; }
      .globe.arrived .cell.choice { animation: rise 0.5s 0.3s both; }
      .globe.diving { transition: transform 1.4s cubic-bezier(0.6, 0, 0.9, 0.4); }
      .globe.diving .trail, .globe.diving .walked, .globe.diving .cell:not(.squad) { opacity: 0; transition: opacity 0.5s; }
      /* Glows blown up fourteen times outgrow what the graphics card draws, and show as black boxes. */
      .globe.diving .land, .globe.diving .walked, .globe.diving .trail { filter: none; }
      .globe.diving .chopper { opacity: 0; transition: opacity 0.4s; }
      .clouds { position: fixed; inset: 0; z-index: 50; pointer-events: none; overflow: hidden; }
      .clouds i { position: absolute; left: var(--x); top: var(--y); width: 70vmax; height: 50vmax; margin: -25vmax -35vmax; border-radius: 50%; background: radial-gradient(closest-side, #f4f7fbee, #dfe7f0aa 55%, transparent); animation: cloud 1.4s var(--d) ease-in both; }
      .clouds.parting i { animation: part 1.1s ease-out both; }
      @keyframes cloud { from { opacity: 0; transform: scale(0.2); } 60% { opacity: 1; } to { opacity: 1; transform: scale(1.6); } }
      @keyframes part { from { opacity: 1; transform: scale(1.6); } to { opacity: 0; transform: scale(4); } }
      @keyframes pulse { 50% { box-shadow: 0 0 0 5px #ffd166aa, 0 0 22px #ffd166; } }
      .map .node.fog { color: #6b7690; border: 2px dashed #4a5670; font-size: 14px; font-weight: bold; }
      .node { font-size: 26px; width: 44px; height: 44px; line-height: 44px; text-align: center; border-radius: 50%; border: 3px solid #888; background: #1d2433; }
      .node.safe { border-color: #7ddc5a; }
      .node.dangerous { border-color: #ff6b5e; }
      .node.supply, .node.cache { border-color: #6fb7ff; }
      .node.shop { border-color: #ffd34e; }
      .node.unknown { border-color: #c28bff; }
      .node.key, .node.final { border-color: #c77dff; }
      button.travel { min-width: 320px; text-align: left; line-height: 1.5; }
      .buy { display: flex; flex: 1; flex-direction: column; gap: 4px; }
      .buy button.card { flex: 1; }


      .squad { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
      .soldier { flex: 1; max-width: 220px; padding: 8px 12px; background: #263042; border: 1px solid #4a5a78; border-radius: 6px; line-height: 1.5; }
      .soldier.died { opacity: 0.6; border-color: #ff6b5e; }
      .soldier .notes { list-style: none; margin: 4px 0 0; padding: 0; font-size: 12px; color: #9aa6bd; }
      .soldier .notes li { cursor: help; }
      .soldier .notes .feat { color: #ffd84d; }
      .bar { height: 6px; margin: 6px 0; background: #10141c; border-radius: 3px; overflow: hidden; }
      .bar div { height: 100%; background: #ffd84d; }
      .bar .fill { animation: fill 0.9s 1.7s both; }
      .health { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #ff8a8a; }
      .health .bar { flex: 1; height: 6px; margin: 0; }
      .health .bar { position: relative; }
      .health .bar div { background: #e04848; }
      .health .bar div.armor { position: absolute; top: 0; height: 100%; background: #ffd166; }
      .health span.armor { color: #ffd166; }
      @keyframes fill { from { width: var(--from); } to { width: var(--to); } }
      .soldier .who { display: flex; gap: 10px; align-items: center; line-height: 1.2; }
      .soldier .who small { color: #9aa6bd; }
      .portrait { display: grid; place-items: center; width: 40px; height: 40px; flex: none; font-size: 22px; background: #10141c; border: 2px solid #4a5a78; border-radius: 50%; }
      .soldier .gained { color: #ffd84d; }
      .soldier.levelled { animation: levelled 0.8s 2.6s both; }
      .soldier.levelled .portrait { animation: pulse 0.8s 2.6s 2; }
      @keyframes levelled { 40% { border-color: #ffd84d; box-shadow: 0 0 18px #ffd84daa; } }
      .soldier small.gear { display: block; margin-top: 4px; padding: 1px 6px; font-size: 12px; }
      .stats { width: 100%; margin: 4px 0; font-size: 13px; }

      .stats td:nth-child(odd) { color: #9aa6bd; }
      .stats td:nth-child(even) { text-align: right; padding-right: 12px; }
      .promoted { display: inline-block; animation: land 0.5s 2.5s both; }

      .gear { border-color: #4a5a78; }
      .gear.rare { border-color: #4da3ff; }
      .gear.rare > small:first-child, .slot.rare b { color: #4da3ff; }
      .gear.epic { border-color: #c77dff; }
      .gear.epic > small:first-child, .slot.epic b { color: #c77dff; }
      div.gear { padding: 8px 12px; border: 1px solid; border-radius: 6px; background: #263042; line-height: 1.5; }
      .stats td.down, .stats td.up { font-weight: bold; }
      .slot { display: block; margin-top: 6px; padding: 5px 10px; border: 1px solid; border-radius: 4px; background: #1d2433; }
      .stash { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
      .who { display: block; width: 100%; padding: 4px 8px; text-align: left; background: none; border-color: transparent; line-height: 1.4; }
      .who.chosen { background: #35496b; outline: 2px solid #ffd84d; }
      .details { display: flex; gap: 24px; align-items: flex-start; }
      .details .stats { width: 260px; flex: none; }
      .details > div { flex: 1; }

      .keywords { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
      .kw { padding: 1px 8px; border: 1px solid; border-radius: 10px; font-size: 11px; opacity: 0.75; }
      .kw.resist { padding: 1px 4px; margin-left: 4px; text-decoration: line-through; text-decoration-thickness: 2px; }
      .tip { text-decoration: underline dotted; cursor: help; }
      .kw { cursor: help; white-space: nowrap; }
      .kwi { font-weight: bold; white-space: nowrap; }
      .kwi.held { text-shadow: 0 0 6px currentColor; }
      .kwi.burn { color: #ff8a3d; } .kwi.frost { color: #7fd4ff; } .kwi.mark { color: #ff6bd6; }
      .kwi.crit { color: #ffd84d; } .kwi.kill { color: #ff6b5e; } .kwi.ward { color: #9aa6bd; }
      .card, .gear, .described { position: relative; }
      .defs { display: none; position: absolute; left: 0; top: 100%; z-index: 20; width: 260px; flex-direction: column; gap: 4px; padding-top: 4px; text-align: left; font-weight: normal; }
      .card:hover .defs, .gear:hover .defs, .described:hover .defs, .card:focus .defs { display: flex; }
      .def { display: block; background: #0d1118; border: 1px solid #3a4456; border-radius: 6px; padding: 6px 8px; font-size: 12px; color: #d6dbe4; }
      .def b { display: block; margin-bottom: 2px; }
      .kw.held { opacity: 1; font-weight: bold; box-shadow: 0 0 6px currentColor; }
      .kw.burn { color: #ff8a3d; } .kw.frost { color: #7fd4ff; } .kw.mark { color: #ff6bd6; }
      .kw.crit { color: #ffd84d; } .kw.kill { color: #ff6b5e; } .kw.ward { color: #9aa6bd; }
      .choices { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; }
      .choices + .choices { margin-top: 16px; }
      .choices button { flex: 1; text-align: left; line-height: 1.5; display: flex; flex-direction: column; justify-content: flex-start; }
      .choices button > * { margin: 0; }
      .choices button br { display: none; }
      button.card { min-height: 110px; }
      button.decide { padding: 12px 20px; }
      button.gearpick { display: flex; flex-direction: column; gap: 6px; width: 200px; padding: 12px; text-align: left; border: 2px solid #3a465c; }
      .loot .said .choices { flex-wrap: wrap; justify-content: center; }
      button.gearpick .who { display: flex; align-items: center; gap: 8px; }
      button.gearpick.sell { justify-content: center; align-items: center; }
      .buyers { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
      .buyers button { padding: 3px 8px; font-size: 12px; }
      button.gearpick .gear small { margin-right: 6px; }
      button.gearpick ~ button.decide, .choices + button.decide { margin-top: 10px; }
      button.rare { border-color: #4da3ff; }
      button.rare small { color: #4da3ff; }
      button.epic { border-color: #c77dff; }
      button.relic, .gear.relic { border-color: #ffd84d; }
      button.relic small, .gear.relic > small:first-child, button.skill small { color: #ffd84d; }
      button.skill { border-color: #7ddc5a; }
      button.epic small { color: #c77dff; }

      .stage { animation: rise 0.5s both; }
      /* Debrief: centred, each soldier given room to be seen. */
      .debrief { display: flex; flex-direction: column; align-items: center; text-align: center; padding-top: 4vh; }
      .debrief h1 { font-size: 40px; margin-bottom: 8px; }
      .debrief .squad { justify-content: center; gap: 20px; }
      .debrief .soldier { width: 280px; padding: 20px; }
      .tally { margin: 0 auto 14px; font-size: 14px; }
      .tally th { padding: 2px 14px; color: #9aa6bd; font-weight: normal; }
      .tally td { padding: 3px 14px; text-align: center; }
      .tally td:first-child { display: flex; align-items: center; gap: 8px; text-align: left; white-space: nowrap; }
      .debrief .tally .portrait { width: 26px; height: 26px; font-size: 14px; border-width: 2px; }
      .tally td.best { color: #ffd166; font-weight: bold; }
      .debrief .who { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; }
      .debrief .portrait { width: 96px; height: 96px; font-size: 50px; border-width: 3px; }
      .debrief .soldier .bar { height: 12px; margin-top: 10px; }
      .joined { justify-content: center; min-height: 80vh; gap: 10px; }
      .joined .portrait { width: 160px; height: 160px; font-size: 84px; border-color: #ffd166; box-shadow: 0 0 40px #ffd16655; animation: land 0.7s both; }
      .joined h1 { font-size: 52px; margin: 8px 0 0; animation: rise 0.6s 0.4s both; }
      .joined > :not(.portrait):not(h1) { animation: rise 0.6s 0.8s both; }
      .joined .feats { display: flex; gap: 6px; justify-content: center; }
      /* A debrief seen once, a pop-up closed over it, stands still. */
      .debrief.still, .debrief.still * { animation: none !important; }
      .debrief.still .fill { width: var(--to); }
      .crates { display: flex; justify-content: center; gap: 8px; margin-top: 10px; }
      .crate { font-size: 34px; padding: 4px 10px; background: none; border-color: #ffd166; animation: wiggle 1.4s ease-in-out infinite; }
      @keyframes wiggle { 0%, 70%, 100% { transform: rotate(0); } 75% { transform: rotate(-10deg); } 85% { transform: rotate(10deg); } 95% { transform: rotate(-5deg); } }
      /* A pop-up over the debrief: the ability choice, or a crate opening. */
      .modal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: #0a0d13cc; animation: fade 0.25s; }
      .modal .sheet { max-width: min(900px, 92vw); text-align: center; }
      .loot { position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; --glow: #9aa6bd; }
      .loot.rare { --glow: #4da3ff; }
      .loot.epic { --glow: #c77dff; }
      .loot .box { font-size: 96px; animation: shake 0.7s ease-in-out, pop 0.35s 0.7s ease-in forwards; }
      .loot .burst { position: absolute; top: 60px; left: 50%; width: 520px; height: 520px; margin: -260px; border-radius: 50%; background: repeating-conic-gradient(var(--glow) 0 8deg, transparent 8deg 24deg); -webkit-mask-image: radial-gradient(closest-side, #000, transparent); mask-image: radial-gradient(closest-side, #000, transparent); opacity: 0; animation: rays 6s linear infinite, glowin 0.4s 0.8s forwards; pointer-events: none; }
      .loot .prize { position: relative; min-width: 260px; margin-top: -110px; padding: 14px 18px; border-radius: 10px; background: #1d2433; box-shadow: 0 0 30px var(--glow); opacity: 0; animation: reveal 0.5s 0.95s cubic-bezier(0.2, 1.6, 0.4, 1) forwards; }
      .loot .said { display: flex; align-items: center; gap: 10px; opacity: 0; animation: appear 0.4s 1.5s forwards; }
      .loot .said .portrait { width: 44px; height: 44px; font-size: 24px; }
      .loot button { opacity: 0; animation: appear 0.4s 1.8s forwards; }
      @keyframes appear { from { transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @keyframes glowin { to { opacity: 0.55; } }
      @keyframes shake { 20%, 60% { transform: rotate(-12deg) scale(1.05); } 40%, 80% { transform: rotate(12deg) scale(1.1); } }
      @keyframes pop { to { transform: scale(1.8); opacity: 0; } }
      @keyframes rays { to { transform: rotate(360deg); } }
      @keyframes reveal { from { opacity: 0; transform: translateY(30px) scale(0.5); } to { opacity: 1; transform: none; } }
      .debrief button[data-seen] { min-width: 200px; margin-top: 8px; }
      .stage.second { margin-top: 12px; animation-delay: 1.2s; }
      .stage.third { margin-top: 12px; animation-delay: 2.8s; }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
      .landed { display: inline-block; color: #ffd84d; animation: land 0.6s 0.6s both; }
      @keyframes land { from { opacity: 0; transform: scale(3); } }
      @media (max-width: 900px) {
        body { font-size: 12px; }
        #panel { padding: 8px 12px; }
        .choices, .squad, .details, .header { flex-wrap: wrap; }
        .stash { grid-template-columns: repeat(2, 1fr); }
      }
    </style>
  </head>
  <body>
    <div class="vignette"></div>
    <div id="hud"><span id="status"></span></div>
    <div id="dial" hidden><div class="spin"><div class="half ally">Allied<br />turn</div><div class="half enemy">Enemy<br />turn</div></div></div>
    <div id="drop" hidden></div>
    <div id="kit" hidden></div>
    <div id="panel"></div>
    <button id="fullscreen" title="Full screen">⛶</button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
