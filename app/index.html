<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TacticalAuto</title>
    <style>
      body { margin: 0; overflow: hidden; background: #10141c; color: #dde; font: 14px sans-serif; }
      canvas { display: block; }
      #hud { position: absolute; top: 12px; left: 12px; }
      #start { margin-left: 12px; }
      #panel { position: absolute; top: 24px; left: 40px; width: 1200px; box-sizing: border-box; padding: 14px 24px 18px; background: #171d29f2; border: 1px solid #3a465c; border-radius: 8px; }
      #panel[hidden] { display: none; }
      h1 { margin: 0 0 4px; font-size: 22px; }
      h2 { margin: 16px 0 8px; font-size: 14px; font-weight: normal; color: #9aa6bd; }
      ul { margin: 0; padding: 0; list-style: none; line-height: 1.6; }
      .columns { display: flex; gap: 32px; }
      .side { flex: 0 0 190px; }
      .facilities { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
      .facilities button { text-align: left; padding: 6px 10px; line-height: 1.4; }
      .supplies { color: #ffd84d; }
      button:disabled { opacity: 0.45; cursor: default; }
      button:disabled:hover { background: #263042; }
      small { color: #9aa6bd; }
      .up { color: #ff6b5e; }
      .down { color: #7ddc5a; }
      .threat { padding: 0 8px; color: #ff6b5e; letter-spacing: 2px; }
      .choices { display: flex; gap: 16px; }
      button { font: inherit; color: #dde; background: #263042; border: 1px solid #4a5a78; border-radius: 6px; padding: 10px 16px; cursor: pointer; }
      button:hover { background: #32405a; }
      .choices button { flex: 1; text-align: left; line-height: 1.5; }
      .outcome { min-height: 1.5em; }
      .outcome span.chosen, .outcome span.skipped { display: none; }
      button:hover .chosen { display: inline; }
      .choices:has(button:hover) button:not(:hover) .skipped { display: inline; }
      button.lastStand, button.final { border-color: #ff6b5e; }
      button.card { min-height: 110px; }
      button.common small { color: #9aa6bd; }
      button.rare { border-color: #4da3ff; }
      button.rare small { color: #4da3ff; }
      button.epic { border-color: #c77dff; }
      button.epic small { color: #c77dff; }
    </style>
  </head>
  <body>
    <div id="hud"><span id="status"></span><button id="start">Start battle</button></div>
    <div id="panel"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
