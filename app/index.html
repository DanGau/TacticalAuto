<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10141c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>TacticalAuto</title>
    <style>
      body { margin: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overflow: hidden; height: 100vh; display: flex; align-items: center; background: #10141c; color: #dde; font: 14px sans-serif; }
      canvas { display: block; position: fixed; inset: 0; }
      /* The panels are laid out for a 1280 by 720 window and scale with it. */
      body > :not(canvas, script) { zoom: var(--ui, 1); }
      #hud { position: absolute; top: 12px; left: 12px; pointer-events: none; }
      /* The turn dial: a sphere, its allied half and its enemy half, that turns the side whose turn it is to the front. */
      #dial { position: absolute; top: 12px; right: 12px; width: 76px; height: 76px; perspective: 320px; pointer-events: none; }
      #dial[hidden] { display: none; }
      #dial .spin { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateY(var(--turn, 0deg)); transition: transform 0.9s cubic-bezier(0.65, 0, 0.35, 1); }
      #dial .half { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; border-radius: 50%; backface-visibility: hidden; color: #fff; font: bold 10px/1.2 sans-serif; letter-spacing: 1px; text-align: center; text-transform: uppercase; text-shadow: 0 1px 2px #0008; }
      #dial .ally { background: radial-gradient(circle at 50% 50%, #4f9be0, #1d4f86 70%, #0d2440); }
      #dial .enemy { transform: rotateY(180deg); background: radial-gradient(circle at 50% 50%, #e0574a, #8a2a22 70%, #3d0f0b); }
      #dial::after { content: ''; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 34% 28%, #ffffff59, transparent 42%), radial-gradient(circle at 50% 50%, transparent 58%, #0007 100%); box-shadow: 0 2px 10px #0009; }
      #panel { position: fixed; inset: 0; zoom: calc(var(--ui, 1) * var(--shrink, 1)); overflow-x: hidden; overflow-y: auto; box-sizing: border-box; padding: 14px max(24px, calc(50% - 600px)) 18px; background: #171d29; }
      #panel[hidden], #drop[hidden] { display: none; }
      /* The briefing as a film: bars across the top and bottom, a muted grade, and the edges sunk into dark. */
      body::before, body::after { content: ''; position: fixed; left: 0; right: 0; z-index: 4; height: 0; background: #000; transition: height 0.9s ease-in-out; pointer-events: none; }
      body::before { top: 0; }
      body::after { bottom: 0; }
      body.cinema::before, body.cinema::after { height: 11vh; }
      canvas { transition: filter 1.2s ease-in-out; }
      body.cinema canvas:first-of-type { filter: saturate(0.8) contrast(1.12) brightness(0.95); }
      body.cinema .brief { bottom: 1.5vh; background: none; }
      .vignette { position: fixed; inset: 0; z-index: 3; pointer-events: none; background: radial-gradient(ellipse at 58% 42%, transparent 45%, rgba(0, 0, 0, 0.55) 100%); opacity: 0; transition: opacity 1.2s ease-in-out; }
      body.cinema .vignette { opacity: 1; }
      #hud { transition: opacity 0.6s; }
      .src { white-space: nowrap; font-weight: bold; }
      #log { position: fixed; left: 60px; bottom: 12px; z-index: 2; max-width: min(460px, calc(100vw - 24px)); background: rgba(10, 13, 19, 0.85); border-radius: 6px; font-size: 12px; }
      #log[hidden], #kit[hidden] { display: none; }
      #log summary { cursor: pointer; padding: 4px 10px; color: #aab; }
      #log ol { list-style: none; margin: 0; padding: 0 10px 6px; max-height: 30vh; overflow-y: auto; }
      #log li { padding: 1px 0; border-top: 1px solid #ffffff10; }
      #kit { position: fixed; z-index: 6; max-width: 280px; padding: 8px 10px; border-radius: 6px; background: rgba(10, 13, 19, 0.92); box-shadow: 0 2px 10px #0009; font-size: 12px; pointer-events: none; }
      #kit .kit-row { display: flex; flex-wrap: wrap; gap: 2px 8px; margin-top: 4px; }
      #kit .kit-row small { width: 100%; color: #889; text-transform: uppercase; font-size: 9px; letter-spacing: 1px; }
      body.cinema #log { opacity: 0; }
      body.cinema #hud { opacity: 0; }
      .brief { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 5; width: min(560px, calc(100vw - 32px)); box-sizing: border-box; padding: 10px 16px; border-radius: 8px; background: rgba(10, 13, 19, 0.85); color: #e8e2c8; font-size: 16px; line-height: 1.5; pointer-events: none; animation: fade 0.4s; }
      .brief p { margin: 0; animation: fade 0.6s; }
      .brief p:not(:last-child) { color: #9aa6bd; font-size: 14px; }
      #drop.briefing { visibility: hidden; }
      .intro { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 16px; background: radial-gradient(#232c3d, #0a0d13 70%); text-align: center; animation: fade 0.6s; }
      .intro svg { width: min(52vh, 80vw); height: auto; }
      .intro h1 { font-size: 32px; letter-spacing: 2px; text-transform: uppercase; }
      .intro p { max-width: 520px; color: #9aa6bd; font-style: italic; }
      .intro button { margin-top: 12px; }
      @keyframes fade { from { opacity: 0; } }
      .bought, button.bought:disabled { opacity: 0.3; filter: grayscale(1); }
      .purchased { color: #ffd166; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
      .choices .kit { flex: 1; margin: 0; align-self: center; color: #9aa6bd; }
      #drop { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); width: min(560px, calc(100vw - 32px)); box-sizing: border-box; padding: 10px 14px; background: #171d29ee; border: 1px solid #3a465c; border-radius: 8px; line-height: 1.5; }
      #drop > button { margin-top: 6px; width: 100%; }
      h1 { margin: 0 0 4px; font-size: 22px; }
      h2 { margin: 16px 0 8px; font-size: 14px; font-weight: normal; color: #9aa6bd; }
      p { margin: 6px 0; }
      ul { margin: 0; padding: 0; list-style: none; line-height: 1.6; }
      table { border-spacing: 0; }
      small { color: #9aa6bd; }
      .up { color: #ff6b5e; }
      .down { color: #7ddc5a; }
      .supplies { color: #ffd84d; }

      button { font: inherit; color: #dde; background: #263042; border: 1px solid #4a5a78; border-radius: 6px; padding: 10px 16px; cursor: pointer; }
      button:hover { background: #32405a; }
      button:disabled { opacity: 0.45; cursor: default; }
      button:disabled:hover { background: #263042; }

      .header { display: flex; align-items: center; gap: 24px; position: relative; z-index: 2; }
      /* Flight: the map fills the screen under the header and what floats over it. */
      .map.flight { position: fixed; inset: 0; z-index: 0; padding: 0; }
      .map.flight .globe { position: absolute; inset: 0; }
      .strip { position: fixed; left: 16px; top: 70px; z-index: 2; display: flex; gap: 8px; }
      .strip .mate { width: 40px; }
      .strip .portrait { width: 34px; height: 34px; font-size: 18px; margin: 0 auto; }
      .strip .bar { height: 5px; margin: 4px 0 0; }
      .strip .bar div { background: #4fe08a; }
      .strip .low .portrait { border-color: #e04848; background: #3a1414; }
      .strip .low .bar div { background: #e04848; }
      .stopcard { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 2; padding: 8px 16px; border-radius: 10px; background: #171d29dd; border: 1px solid #3a465c; width: max-content; max-width: min(640px, calc(100vw - 48px)); box-sizing: border-box; pointer-events: none; }
      .tabs { display: flex; gap: 4px; flex: 1; }
      .tab { padding: 6px 18px; background: none; border-color: transparent; color: #9aa6bd; }
      .tab.active { background: #263042; border-color: #4a5a78; color: #dde; }

      .threat { display: inline-flex; width: 120px; height: 8px; margin: 0 8px; vertical-align: middle; background: #10141c; border: 1px solid #ff6b5e; border-radius: 4px; overflow: hidden; }
      .threat i { background: #ff6b5e; }
      .threat i.landed { background: #ffd84d; transition: width 0.6s 0.6s; }
      .skip { position: absolute; right: 24px; bottom: 24px; z-index: 6; }
      #fullscreen { position: absolute; bottom: 12px; left: 12px; z-index: 10; padding: 6px 10px; font-size: 18px; }
      :fullscreen #fullscreen { display: none; }
      /* Installed, the game opens full screen already. */
      @media (display-mode: fullscreen), (display-mode: standalone) { #fullscreen { display: none; } }
      .menu { text-align: center; padding: 24px 0 8px; }
      .menu:not(.picking) { animation: rise 0.6s both; }
      .menu h1 { font-size: 44px; letter-spacing: 6px; margin: 24px 0 8px; }
      .menu > p { color: #9aa6bd; margin-bottom: 28px; }
      .menu .choices { text-align: left; margin: 16px 0 20px; }
      .story { max-width: 640px; margin: 8vh auto 0; animation: none; }
      .story p, .story button { font-size: 19px; line-height: 1.6; color: #e8e2c8; animation: rise 1.1s backwards; }
      .story p { margin: 0 0 18px; }
      /* The recruit choice: three small cards over a swaying globe; one opens into a dossier, the globe sliding behind the hero. */
      .picking { position: relative; z-index: 1; min-height: calc(100vh / var(--ui, 1) - 40px); display: flex; flex-direction: column; justify-content: flex-end; padding: 0; }
      .picking > h2 { position: fixed; top: 18px; left: 0; right: 0; margin: 0; font-size: 22px; letter-spacing: 2px; text-transform: uppercase; color: #e8e2c8; text-shadow: 0 2px 8px #0a1626; pointer-events: none; }
      #panel:has(.picking) { overflow: hidden; }
      .picking .globe, .picking .globe svg { overflow: visible; }
      .picking .globe { transition: transform 0.7s cubic-bezier(0.3, 0.7, 0.2, 1), opacity 0.7s; }
      /* The hero stands on their city. */
      .picking.opened .globe { transform: translate(-18%, 24%); }
      .picking.opened .cell.chosen { opacity: 0; }
      /* A glow is cut off at the edge of the window the globe slid from. */
      .picking.opened .land { filter: none; }
      .joined .dossier { background: radial-gradient(circle at 30% 50%, #16324f, #0a1626 70%); }
      .deploying .dossier { background: transparent; transition: background 0.4s; }
      .picking.opened > h2, .picking.opened .choices { opacity: 0; transition: opacity 0.3s; }
      .picking .cell { transform: none; }
      .picking .cell .home { display: block; transform: translate(-50%, -50%); width: 10px; height: 10px; border-radius: 50%; background: #c77dff; box-shadow: 0 0 8px #c77dff; text-indent: 16px; line-height: 10px; white-space: nowrap; font-size: 12px; color: #e8e2c8; text-shadow: 0 0 4px #0a1626, 0 0 4px #0a1626; }
      .picking .cell .home.chosen { background: #ffd166; box-shadow: 0 0 0 6px #ffd16633, 0 0 16px #ffd166; color: #ffd166; font-weight: bold; font-size: 15px; }
      .menu.picking .choices { position: relative; margin: 0 0 12px; gap: 20px; text-align: left; }
      .choices .recruit { flex: 0 1 260px; display: grid; grid-template-columns: 52px 1fr; grid-template-rows: auto auto auto auto; column-gap: 14px; row-gap: 2px; align-items: center; padding: 16px 18px; border-radius: 14px; border: 1px solid #4a5a7880; background: linear-gradient(160deg, #263553e6, #141b29f0); backdrop-filter: blur(6px); box-shadow: 0 10px 30px #0008; transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s; animation: rise 0.6s backwards; }
      .choices .recruit:nth-child(2) { animation-delay: 0.1s; }
      .choices .recruit:nth-child(3) { animation-delay: 0.2s; }
      .choices .recruit:hover, .choices .recruit:focus-visible { transform: translateY(-4px); border-color: #ffd84d; box-shadow: 0 14px 34px #000a, 0 0 0 1px #ffd84d55; background: linear-gradient(160deg, #2e4066f0, #171f30f5); }
      .recruit .emblem { grid-row: 1 / span 2; width: 52px; height: 52px; display: grid; place-items: center; font-size: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #4da3ff55, #10141c); border: 1px solid #4da3ff88; }
      .recruit .cls, .dossier .cls { color: #ffd84d; text-transform: uppercase; letter-spacing: 1.5px; font-size: 11px; }
      .recruit .cls { align-self: end; }
      .recruit .name { font-size: 20px; align-self: start; line-height: 1.2; }
      .recruit .line { grid-column: 1 / -1; font-size: 13px; color: #c9d2e3; margin-top: 4px; }
      .recruit .line + .line { margin-top: 0; }
      .recruit .line i { display: inline-block; width: 18px; font-style: normal; color: #9ad7ff; }
      .dossier { position: fixed; inset: 0; z-index: 3; display: grid; grid-template-columns: 1fr minmax(360px, 440px); gap: 24px; align-items: center; padding: 32px max(32px, calc(50% - 600px)); background: linear-gradient(90deg, #0a162600 30%, #0a1626cc 62%, #0a1626f2); text-align: left; }
      .dossier .stage { --unit: 1; position: relative; height: min(70vh, 520px); perspective: 700px; }
      .dossier .stage > * { position: absolute; left: 50%; }
      .dossier .emblem { top: 50%; width: calc(320px * var(--unit)); height: calc(320px * var(--unit)); margin: calc(-280px * var(--unit)) 0 0 calc(-160px * var(--unit)); display: grid; place-items: center; font-size: calc(140px * var(--unit)); border-radius: 50%; background: radial-gradient(circle, #0a1626cc 30%, #0a162600 70%); border: 2px solid #4da3ff40; box-shadow: 0 0 60px #4da3ff30, inset 0 0 60px #4da3ff30; }
      .dossier .emblem::after { content: ""; position: absolute; inset: calc(16px * var(--unit)); border-radius: 50%; border: 1px dashed #ffd84d66; animation: turn 30s linear infinite; }
      .dossier .pedestal { top: 50%; width: calc(200px * var(--unit)); height: calc(200px * var(--unit)); margin: calc(-10px * var(--unit)) 0 0 calc(-100px * var(--unit)); border-radius: 50%; background: radial-gradient(circle, #0a1626 0 18%, #0a162600 19%), repeating-conic-gradient(#4da3ff66 0 3deg, #1d3a5e 3deg 30deg); border: 3px solid #4da3ff; box-shadow: 0 0 40px #4da3ff88, inset 0 0 30px #000; transform: rotateX(72deg); animation: pedestal 14s linear infinite; }
      .dossier .figure { top: 50%; width: calc(72px * var(--unit)); height: calc(120px * var(--unit)); margin: calc(-30px * var(--unit)) 0 0 calc(-36px * var(--unit)); border-radius: calc(24px * var(--unit)); display: grid; place-items: center; font: bold calc(52px * var(--unit)) sans-serif; color: #10141c; box-shadow: 0 0 30px #4da3ff99, inset -10px -10px 20px #0004, inset 8px 8px 16px #fff3; animation: idle 3s ease-in-out infinite; }
      .dossier .about { display: flex; flex-direction: column; gap: 10px; max-height: 100%; }
      .dossier h2 { font-size: 34px; margin: -6px 0 0; line-height: 1.1; color: #fff; font-weight: bold; }
      .dossier .actions .decide { background: #ffd84d; border-color: #ffd84d; color: #10141c; font-weight: bold; }
      .dossier .actions .decide:hover { background: #ffe680; }
      .dossier .home { color: #9ad7ff; font-size: 13px; }
      .dossier .key { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 8px; background: #1d2840d9; border: 1px solid #ffffff10; }
      .dossier .key .label { color: #9aa6bd; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
      .dossier .key b { font-size: 16px; }
      .dossier .key span { font-size: 13px; line-height: 1.4; color: #c9d2e3; }
      .dossier .statblock { margin: 0; }
      .dossier .duos { font-size: 12px; color: #9aa6bd; }
      .dossier .actions { display: flex; gap: 12px; margin-top: 6px; }
      .dossier .actions button { flex: 1; padding: 12px; font-size: 16px; }
      .dossier .actions .decide { flex: 2; }
      @keyframes turn { to { transform: rotate(360deg); } }
      @keyframes pedestal { to { transform: rotateX(74deg) rotateZ(360deg); } }
      @keyframes idle { 50% { transform: translateY(-6px); } }
      @media (max-width: 700px) {
        .menu.picking .choices { flex-direction: column; align-items: stretch; gap: 10px; margin: 0 4px 8px; }
        .choices .recruit { flex: none; max-width: none; padding: 12px 14px; }
        .picking.opened .globe { transform: translateY(-11%); }
        .picking > h2 { font-size: 26px; }
        .recruit .emblem { width: 64px; height: 64px; font-size: 32px; }
        .choices .recruit { grid-template-columns: 64px 1fr; }
        .recruit .cls { font-size: 15px; }
        .recruit .name { font-size: 28px; }
        .recruit .line { font-size: 19px; }
        .dossier h2 { font-size: 40px; }
        .dossier .cls, .dossier .home, .dossier .key .label, .dossier .duos { font-size: 15px; }
        .dossier .key b { font-size: 21px; }
        .dossier .key span { font-size: 18px; }
        .dossier .statblock small { font-size: 13px; }
        .dossier .statblock b { font-size: 18px; }
        .dossier .actions button { font-size: 21px; padding: 14px; }
        .dossier { grid-template-columns: 1fr; grid-template-rows: calc(36vh / var(--ui, 1)) auto; gap: 8px; padding: 12px 16px 16px; align-items: start; overflow-y: auto; background: linear-gradient(180deg, #0a162600 20%, #0a1626e6 42%, #0a1626f7); }
        .dossier .stage { --unit: 0.85; height: calc(36vh / var(--ui, 1)); }
        .dossier h2 { font-size: 26px; }
        .dossier .key { padding: 8px 10px; }
      }
      /* A phone on its side: name and home over the hero, the details in two columns, all on one screen. */
      @media (min-width: 701px) and (max-height: 600px) {
        .dossier { grid-template-columns: 0.8fr 1.2fr; padding: 10px max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left)); gap: 12px; }
        .dossier .stage { --unit: 0.6; height: 100%; }
        .dossier .who { position: absolute; top: 10px; left: max(16px, env(safe-area-inset-left)); display: flex; flex-direction: column; text-shadow: 0 2px 6px #000; }
        .dossier .about { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; align-content: center; }
        .dossier .about > .statblock, .dossier .about > .actions { grid-column: 1 / -1; }
        .dossier .about > .duos { align-self: center; }
        .dossier h2 { font-size: 24px; margin: 0; }
        .dossier .key { padding: 6px 10px; }
        .dossier .key span { font-size: 12px; line-height: 1.3; }
        .dossier .actions { margin-top: 2px; }
        .dossier .actions button { padding: 9px; }
      }
      @media (prefers-reduced-motion: reduce) { .dossier .pedestal, .dossier .figure, .dossier .emblem::after { animation: none; } .picking .globe { transition: none; } }
      .note { font-size: 12px; color: #9aa6bd; white-space: nowrap; }
      .chip { padding: 4px 10px; border: 1px solid #4a5a78; border-radius: 12px; white-space: nowrap; }
      .chip.feat { border-color: #ffd84d; color: #ffd84d; cursor: help; }
      /* The run map: a globe, the stops pinned over it. */
      .map { display: flex; justify-content: center; padding: 4px 0 8px; }
      .globe { position: relative; flex: none; overflow: hidden; }
      .globe .sea { position: absolute; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #1d3a5e, #0a1626 75%); box-shadow: 0 0 40px 8px #4da3ff40; }
      .globe svg { position: absolute; inset: 0; }
      .globe .land { fill: #23402f; stroke: #7fe7c4; stroke-width: 1.2; stroke-opacity: 0.55; filter: drop-shadow(0 0 4px #4fe0a088); }
      .globe .graticule { fill: none; stroke: #4da3ff; stroke-opacity: 0.12; stroke-width: 0.8; }
      .globe .walked { fill: none; stroke: #ffd166; stroke-width: 3; stroke-linecap: round; filter: drop-shadow(0 0 4px #ffd166); }
      .globe .trail { stroke: #dde; stroke-opacity: 0.6; stroke-width: 2; stroke-dasharray: 3 5; }
      .globe .trail.lit { stroke: #ffd166; stroke-opacity: 1; stroke-width: 3; filter: drop-shadow(0 0 3px #ffd166); }
      .globe .trail.dim { stroke-opacity: 0.2; }
      .globe .cell.dim { opacity: 0.4; }
      .globe .city circle { fill: #c77dff; stroke: #fff; stroke-width: 1.5; }
      .globe .city.reached circle { fill: #ffd166; }
      .globe .city text { fill: #e8e2c8; font-size: 13px; font-weight: bold; paint-order: stroke; stroke: #0a1626; stroke-width: 4px; }
      .globe .cell { position: absolute; transform: translate(-50%, -50%); z-index: 1; }
      .map .node { display: inline-block; font-size: 16px; width: 30px; height: 30px; line-height: 30px; border-width: 2px; flex: none; }
      .map .node sup { font-size: 9px; }
      .node.done { opacity: 0.55; }
      .node.here { box-shadow: 0 0 0 3px #ffd166, 0 0 14px #ffd166; }
      .globe .cell.choice { z-index: 2; }
      .globe .cell:not(.choice):not(.squad) .node { transform: scale(0.75); opacity: 0.75; }
      button.option { position: relative; padding: 0; border: none; background: none; border-radius: 50%; }
      button.option .node { width: 40px; height: 40px; line-height: 40px; font-size: 22px; border-color: #ffd166; box-shadow: 0 0 0 3px #ffd166, 0 0 16px #ffd166; animation: pulse 1.6s ease-in-out infinite; }
      button.option::before { content: ''; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid #ffd166; animation: ripple 1.6s ease-out infinite; pointer-events: none; }
      button.option.picked .node { box-shadow: 0 0 0 5px #fff, 0 0 26px #ffd166; animation: none; }
      button.option:hover .node { box-shadow: 0 0 0 4px #ffd166, 0 0 22px #ffd166; }
      button.option .label { position: absolute; left: 50%; top: 100%; transform: translate(-50%, 4px); white-space: nowrap; color: #e8e2c8; font-size: 13px; text-shadow: 0 0 4px #0a1626, 0 0 4px #0a1626; }
      @keyframes ripple { from { transform: scale(0.9); opacity: 0.9; } to { transform: scale(1.8); opacity: 0; } }
      .chopper { position: absolute; z-index: 3; transform: translate(-50%, -110%); font-size: 28px; pointer-events: none; filter: drop-shadow(0 6px 3px #0008); transition: left 1.1s ease-in-out, top 1.1s ease-in-out; }
      .chopper span { display: inline-block; animation: hover 1.2s ease-in-out infinite; }
      .chopper.east span { transform: scaleX(-1); }

      .statpage { display: flex; flex-direction: column; align-items: center; gap: 12px; }

      .chart { padding: 10px 12px; border-radius: 8px; background: #1d2433; }

      .chart h4 b { color: #e8ecf4; font-size: 15px; }

      .strip-share i { height: 100%; }
      .hbar { display: grid; grid-template-columns: minmax(0, 8em) 1fr 3em; align-items: center; gap: 8px; padding: 3px 2px; font-size: 14px; border-radius: 4px; }

      .hbar b { text-align: right; }
      [data-tip] { cursor: help; outline: none; }
      [data-tip]:hover, [data-tip]:focus { box-shadow: 0 0 0 2px #ffd166; }
      .charttip { position: fixed; z-index: 60; max-width: min(320px, 90vw); padding: 8px 10px; border-radius: 6px; background: #0a0d13; border: 1px solid #ffd166; font-size: 13px; line-height: 1.4; white-space: pre-line; text-align: left; pointer-events: none; }
      .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: #9aa6bd; }
      .legend i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; border-radius: 2px; }
      .columns { display: flex; gap: 3px; height: 200px; overflow-x: auto; padding: 4px 2px; }

      .columns .up, .columns .down { display: flex; flex-direction: column; min-height: 0; }

      .columns small { text-align: center; font-size: 11px; color: #9aa6bd; }

      .debrief .who { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; }

      .debrief .soldier .bar { height: 12px; margin-top: 10px; }
      /* A debrief seen once, a pop-up closed over it, stands still. */
      .debrief.still, .debrief.still * { animation: none !important; }
      .debrief.still .fill { width: var(--to); }
      .crates { display: flex; justify-content: center; gap: 8px; margin-top: 10px; }

      @keyframes wiggle { 0%, 70%, 100% { transform: rotate(0); } 75% { transform: rotate(-10deg); } 85% { transform: rotate(10deg); } 95% { transform: rotate(-5deg); } }
      /* A pop-up over the debrief: the ability choice, or a crate opening. */
      .modal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: #0a0d13f2; animation: fade 0.25s; }
      .modal .sheet { max-width: min(900px, 92vw); text-align: center; }
      .loot { position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; --glow: #9aa6bd; }
      .loot.rare { --glow: #4da3ff; }
      .loot.epic { --glow: #c77dff; }
      .loot .box { font-size: 96px; animation: shake 0.7s ease-in-out, pop 0.35s 0.7s ease-in forwards; }
      .loot .burst { position: absolute; top: 60px; left: 50%; width: 520px; height: 520px; margin: -260px; border-radius: 50%; background: repeating-conic-gradient(var(--glow) 0 8deg, transparent 8deg 24deg); -webkit-mask-image: radial-gradient(closest-side, #000, transparent); mask-image: radial-gradient(closest-side, #000, transparent); opacity: 0; animation: rays 6s linear infinite, glowin 0.4s 0.8s forwards; pointer-events: none; }
      .loot .said { display: flex; align-items: center; gap: 10px; opacity: 0; animation: appear 0.4s 1.5s forwards; }
      .loot button { opacity: 0; animation: appear 0.4s 1.8s forwards; }
      @keyframes appear { from { transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @keyframes glowin { to { opacity: 0.55; } }
      @keyframes shake { 20%, 60% { transform: rotate(-12deg) scale(1.05); } 40%, 80% { transform: rotate(12deg) scale(1.1); } }
      @keyframes pop { to { transform: scale(1.8); opacity: 0; } }
      @keyframes rays { to { transform: rotate(360deg); } }
      @keyframes reveal { from { opacity: 0; transform: translateY(30px) scale(0.5); } to { opacity: 1; transform: none; } }
      .debrief button[data-seen] { min-width: 200px; margin-top: 8px; }
      .stage.second { margin-top: 12px; animation-delay: 1.2s; }
      .stage.third { margin-top: 12px; animation-delay: 2.8s; }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
      .landed { display: inline-block; color: #ffd84d; animation: land 0.6s 0.6s both; }
      @keyframes land { from { opacity: 0; transform: scale(3); } }
      .statblock { display: flex; gap: 2px; margin: 4px 0; }
      .statblock span { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 2px 1px; background: #1d2433; border-top: 2px solid #a33; }
      .statblock small { font-size: 9px; letter-spacing: 0.3px; text-transform: uppercase; color: #9aa6bd; }
      .statblock b { font-size: 13px; }
      .use { color: #ffd166; font-size: 11px; }
      .power { margin: 0 0 6px; text-align: left; font-size: 13px; }
      .powers { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 2px 12px; }
      .charsheet { text-align: left; flex: 1; min-width: 0; }

      .foes { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; margin: 4px 0; }
      #drop .picks button.pick.foe, button.pick.foe { width: auto; height: auto; padding: 3px 8px; font-size: 12px; border-color: #a33; }
      @media (max-width: 900px) {
        .powers { grid-template-columns: 1fr; }
        .statblock b { font-size: 11px; }
        body { font-size: 12px; }
        #panel { padding: 8px 12px; }
        .choices, .squad, .details, .header { flex-wrap: wrap; }
        .stash { grid-template-columns: repeat(2, 1fr); }
      }
    </style>
